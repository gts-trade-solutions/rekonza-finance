# Rekonza behind nginx (deploy/vps/setup.sh fills in the @…@; certbot adds TLS).
# The app is on 127.0.0.1 only; nginx is the one proxy in front of it, which is
# why the settings say TRUSTED_PROXY_HOPS=1.
server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAME@;

    # Bill scans, statements and imports.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Reports and the assistant can take a while.
        proxy_read_timeout 120s;
    }
}
